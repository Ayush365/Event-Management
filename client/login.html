<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | EventHub</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="height: 100vh; display: flex; align-items: center; justify-content: center;">
    
    <div class="box" style="width: 100%; max-width: 450px;">
        <div class="logo" style="text-align: center; margin-bottom: 2rem; font-size: 2rem;">EventHub</div>
        <h2 style="text-align: center; margin-bottom: 1.5rem;">Welcome Back</h2>
        
        <form id="login-form">
            <div>
                <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Email Address</label>
                <input type="email" id="email" required>
            </div>
            <div>
                <div style="display: flex; justify-content: space-between;">
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Password</label>
                    <a href="#" style="font-size: 0.8rem; color: var(--primary); text-decoration: none;">Forgot?</a>
                </div>
                <input type="password" id="password" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 1rem;">Sign In</button>
        </form>
        
        <p style="text-align: center; margin-top: 2rem; color: var(--text-muted);">
            Don't have an account? <a href="register.html" style="color: var(--primary); text-decoration: none; font-weight: 600;">Register</a>
        </p>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
